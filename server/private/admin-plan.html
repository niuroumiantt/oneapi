<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>管理台布局方案 · semifly.ai</title><style>
:root{--bg:#172d21;--panel:#243f2d;--line:#52745a;--text:#eff8ee;--dim:#c2d8c5;--accent:#bbff7a;--warn:#ffcf80}*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--text);background:var(--bg);height:100dvh;display:flex;flex-direction:column}button,a{font:inherit}button{cursor:pointer}a{color:var(--accent)}header{height:60px;flex-shrink:0;display:flex;align-items:center;padding:0 24px;gap:25px;border-bottom:1px solid var(--line)}header b{font-size:20px}header span{color:var(--warn);font-size:12px}header a{margin-left:auto;font-size:13px}.bar{display:flex;gap:5px;align-items:center;padding:10px 24px;border-bottom:1px solid var(--line)}button{background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:9px 15px}button.active{background:var(--accent);color:#122315;border-color:var(--accent);font-weight:650}.bar small{margin-left:auto;color:var(--dim)}main{flex:1;min-height:0;overflow:auto;padding:20px 26px;max-width:1560px;width:100%;margin:auto}.heading{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:14px}h1{margin:0 0 5px;font-size:25px}h2{margin:0 0 12px;font-size:16px}p{line-height:1.7;margin:5px 0;color:var(--dim);font-size:13px}.tag{font-size:12px;border:1px solid var(--line);padding:5px 8px;border-radius:5px;white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:15px}.metric span,.metric small{display:block;color:var(--dim);font-size:12px}.metric strong{display:block;font-size:25px;margin:9px 0;color:var(--accent)}.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-bottom:14px}.panel{min-width:0}.panel .list{display:grid;gap:10px}.item{border-bottom:1px solid #54735a80;padding:0 0 10px}.item:last-child{border:0;padding:0}.item b{font-size:14px}.item small{color:var(--dim);font-size:12px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:12px 9px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--dim);font-weight:500}td small{display:block;color:var(--dim);font-size:11px;margin-top:4px}.muted{color:var(--dim)}.warn{color:var(--warn)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.actions{margin-top:13px}.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.flow span{border:1px solid var(--line);padding:9px 12px;border-radius:5px;font-size:12px}.note{border-left:3px solid var(--warn);padding:8px 12px;margin-top:12px;color:var(--dim);font-size:12px;line-height:1.6}.bars{display:grid;gap:10px}.bars>div{display:grid;grid-template-columns:60px 1fr 70px;gap:8px;align-items:center;font-size:12px}.barline{height:9px;background:#173021;border-radius:4px}.barline i{display:block;height:100%;background:var(--accent);border-radius:4px}.side-notes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.side-notes div{padding:12px;background:#1d3526;border-radius:6px}.side-notes b{font-size:13px}dialog{background:#223b2b;color:var(--text);border:1px solid var(--line);border-radius:10px;max-width:650px;padding:25px}dialog::backdrop{background:#0008}dialog ol{padding-left:22px;line-height:1.9}footer{font-size:11px;color:var(--dim);padding:10px 24px;border-top:1px solid var(--line)}body.customer{--bg:#f7f7fc;--panel:#fff;--line:#dadce9;--text:#28283b;--dim:#66677e;--accent:#713ad0;--warn:#9a5b12}body.customer button.active{color:white}body.customer .side-notes div{background:#f0eafa}@media(max-width:900px){.cols{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.side-notes{grid-template-columns:1fr}.bar{flex-wrap:wrap}.bar small{display:none}header{padding:0 12px;gap:12px}header span{display:none}main{padding:15px}.table{overflow:auto}}
</style></head><body><header><b>semifly.ai</b><span>布局方案 · 未上线功能明确标注</span><a href="/api/staff/console#technical/monitor">返回实际管理台 ↗</a></header><nav class="bar" aria-label="方案分区"><button data-page="products" class="active">供应商与模型</button><button data-page="servers">服务器与部署</button><button data-page="customer">个人 / 企业空间</button><small>同一页眉 · 按对象管理 · 操作与证据相连</small></nav><main id="view"></main><footer>产品页仅使用 2026-11-10 12:27 的真实测试快照；不是当前实时延迟。服务器指标未采集，不展示虚构数值。此页操作按钮仅解释拟建流程。</footer><dialog id="details"><h2 id="detailTitle"></h2><div id="detailBody"></div><div class="actions"><button id="close">关闭</button></div></dialog>
<script>
const views={
products:`<div class="heading"><div><h1>供应运行总览</h1><p>先看供应商和模型能否使用、成本与异常，再进入对应公司的维护页面。</p></div><div class="row"><button class="active">全部供应商</button><button data-action="company">KerAPI →</button><span class="tag">测试快照 / 非生产流量</span></div></div><div class="metrics"><div class="metric"><span>已登记供应商 / Key</span><strong>1 / 1</strong><small>KerAPI · 5 个候选型号</small></div><div class="metric"><span>本月测试 / 历史测试</span><strong>4 / 4</strong><small>客户流量须另接统计</small></div><div class="metric"><span>输入 / 输出 Token</span><strong>202 / 145</strong><small>其中推理 133，已含在输出内</small></div><div class="metric"><span>采购成本 / 上游核对</span><strong>待核</strong><small>缺确认费率和上游账单</small></div></div><div class="panel"><h2>模型运行情况</h2><div class="table"><table><thead><tr><th>供应商 / 型号</th><th>状态</th><th>最近实测耗时</th><th>本月用量</th><th>需要操作</th></tr></thead><tbody><tr><td>KerAPI · DeepSeek Flash<small>deepseek-v4.1-flash</small></td><td>4 次响应 / 3 题通过<small class="warn">翻译题推理预算耗尽</small></td><td>1.093–2.143 s<small>2026-11-10 12:27 · 非实时</small></td><td>测试 347 Token<small>4 笔，不含客户调用</small></td><td><button data-action="diagnosis">诊断与复测方案</button></td></tr><tr><td>KerAPI · 其余 4 个候选型号</td><td>未测试</td><td>—</td><td>测试 0</td><td><button data-action="models">型号 / 能力 / 费率</button></td></tr></tbody></table></div></div><div class="cols" style="margin-top:14px"><section class="panel"><h2>KerAPI 公司页：五个栏目</h2><div class="flow"><span>概览</span><span>Key 与路由</span><span>型号与费率</span><span>测试与诊断</span><span>用量与对账</span></div><p>型号、Key、测试、价格共用供应商筛选。每枚 Key 可限制型号，每个型号保留费率生效版本。</p><div class="row actions"><button data-action="rotate">更换 Key 的流程</button><button data-action="metering">三方计量如何对齐</button></div></section><section class="panel"><h2>真实测试耗时 · 毫秒</h2><div class="bars">${[['计算',2143],['JSON',1093],['翻译',1342],['上下文',1506]].map(([name,value])=>`<div><span>${name}</span><span class="barline"><i style="width:${value/22}%"></i></span><span>${value} ms</span></div>`).join('')}</div><p>这些是非流式整次耗时，不是首 Token 延迟；只有四个样本，不能代表 SLA。</p></section></div>`,
servers:`<div class="heading"><div><h1>服务器与部署</h1><p>主机 → 应用 → 日志 → 发布。指标都带采集时间；缺数据明确显示未接入。</p></div><span class="tag">规划中 · 尚未接监控</span></div><div class="metrics">${[['CPU','使用率 / 负载'],['内存','使用率 / OOM'],['带宽','出入站 Mbps / 丢包'],['磁盘','剩余空间 / I/O / inode']].map(([a,b])=>`<div class="metric"><span>${a}</span><strong>—</strong><small>${b} · 待采集</small></div>`).join('')}</div><div class="cols"><section class="panel"><h2>基础设施观察</h2><div class="list"><div class="item"><b>主机与网络</b><p>CPU、内存、磁盘、带宽；从指定探测点测服务连通性，标清采样时间。</p></div><div class="item"><b>服务与数据库</b><p>网关/API/数据库健康、重启次数、连接数、请求积压、备份最近成功时间。</p></div><div class="item"><b>告警定位</b><p>高资源占用 → 对应服务 → 同一时段请求和错误日志。</p></div></div></section><section class="panel"><h2>软件与发布观察</h2><div class="list"><div class="item"><b>部署版本</b><p>运行版本、已批准待发布版本、仓库提交、最近发布结果。</p></div><div class="item"><b>代码与依赖异常</b><p>5xx、异常堆栈摘要、超时；依赖升级、迁移和兼容性检查。</p></div><div class="item"><b>维护操作</b><p>查看日志、健康检查、指定服务重启、发布批准版本、回滚。每个动作都有执行进度和审计。</p></div></div><button data-action="maintenance">查看操作边界</button></section></div><div class="note">复用已有云监控与部署系统，控制台汇总必要指标和维护动作。观察 CPU 不会消耗模型 Token；主动模型探测会，必须有独立预算。</div>`,
customer:`<div class="heading"><div><h1>统一身份，独立工作空间</h1><p>只注册一次。进入哪个空间、谁付钱、能做什么，始终在页眉说明。</p></div><span class="tag">建议方案 / 待评审</span></div><div class="flow panel"><span>注册 / 登录同一账号</span>→<span>按入口或邀请进入对应空间</span>→<span>个人付款 或 企业预算</span>→<span>创建受限 Key</span>→<span>使用 / 用量 / 账单</span></div><div class="cols" style="margin-top:14px"><section class="panel"><h2>个人空间 · 自己付款</h2><p>我的模型 / API Key / 用量 / 账单 / 设置。</p><p>每个模型显示已用、预算、最近调用与异常；充值和接入配置就近操作。</p><div class="note">个人注册默认进入这里，首屏不出现企业审批、采购和服务器运维。</div></section><section class="panel"><h2>企业空间 · 企业付款</h2><p>员工：获准模型、个人获分配额度、自己的调用。</p><p>管理员：团队概览、员工审批、权限与预算、企业用量账单。</p><div class="note">任何邮箱可通过邀请申请；管理员逐人批准后，默认仍为零预算、零模型权限，再单独分配。</div></section></div><div class="side-notes"><div><b>费用隔离</b><p>Key 创建时固定归属。企业预算不足不自动扣个人钱包，个人余额也不补企业账。</p></div><div><b>企业差价依据</b><p>API 用量价按型号公开；专属容量、SLA、SSO、审计和服务另行定价。</p></div><div><b>平台员工独立授权</b><p>企业管理员不等于平台管理员。业务运营与技术运维只对获授权平台员工显示。</p></div></div>`};
const actions={company:['供应商详情的入口','<p>点击供应商后，同一页眉和公司筛选持续保留，依次管理：概览、Key 与路由、型号与费率、测试与诊断、用量与对账。只有一家公司时不做多余层级。</p>'],rotate:['更换 Key：保留历史、可撤回','<ol><li>录入新 Key，保存为新凭据版本，原 Key 不覆盖。</li><li>确认获准型号、限额和有效期。</li><li>完成连接与小额测试，记录结果。</li><li>切换指定路由，观察新版本流量。</li><li>确认后停用旧版本；历史流水继续关联旧 Key。若 Key 泄漏则立即停用。</li></ol><p>当前已有登记与停用；轮换、路由切换和回滚还需实现。</p>'],models:['型号与价格版本','<p>维护 API Model ID、上游声明版本、实际回报版本、上下文与能力、TPM/RPM、授权 Key、输入/缓存/输出费率、生效时间和依据。目录发现仅说明接口列出该型号，不能证明真实权重。</p>'],diagnosis:['这次测试发现了什么','<p>四次 HTTP 200，三题正确。翻译题的 48 输出 Token 全部用于推理并达到上限。下一批应核实思考模式和输出预算，保留相同题集版本再复测；本次不追加付费调用。</p>'],metering:['客户、平台与上游三方计量','<p>同一客户请求关联平台请求号、每次上游尝试、上游请求号、Key 版本、型号、输入/缓存/输出、费率版本、客户扣款与供应商成本。重试单列，测试与客户流量分开。</p><p>上游 usage 只是响应回报，需要再核上游逐笔账单；本次采购费率和扣款仍未知。</p>'],maintenance:['有边界的维护操作','<p>常规健康检查和只读观察直接执行；重启、发布、回滚限定服务、版本与权限，记录发起人和执行结果。数据库恢复、重大升级列出影响和恢复方案。公网不提供任意 root 命令输入框。</p>']};
const view=document.getElementById('view');function show(page){document.body.classList.toggle('customer',page==='customer');view.innerHTML=views[page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));history.replaceState(null,'','#'+page)}
document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page)return show(page.dataset.page);const action=e.target.closest('[data-action]');if(action){const [title,body]=actions[action.dataset.action];document.getElementById('detailTitle').textContent=title;document.getElementById('detailBody').innerHTML=body;document.getElementById('details').showModal()}});document.getElementById('close').onclick=()=>document.getElementById('details').close();show(views[location.hash.slice(1)]?location.hash.slice(1):'products');
</script></body></html>
