<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>供应商 API 验收台 · semifly.ai</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#1d2743;background:#f4f6f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.top{height:76px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid #e4e9ef}.brand{display:flex;align-items:center;gap:17px}.brand img{width:163px;height:auto}.brand span{font-size:12px;color:#71809a;border-left:1px solid #d7dce6;padding-left:17px}.top a:last-child{font-size:13px;color:#4a6288}.layout{max-width:1500px;margin:auto;display:grid;grid-template-columns:236px minmax(0,1fr);gap:24px;padding:25px 28px}.side{background:#1e2a49;border-radius:20px;color:#dae5f4;padding:24px 14px;min-height:calc(100vh - 126px);display:flex;flex-direction:column}.side h2{font-size:17px;margin:0 10px 7px;color:#fff}.side p{font-size:11px;line-height:1.6;color:#9eb0ca;margin:0 10px 27px}.nav{display:flex;flex-direction:column;gap:6px}.nav button{border:0;background:transparent;color:#b8c9dd;text-align:left;padding:12px 13px;border-radius:10px;font-size:13px}.nav button.active{background:#f8f4ed;color:#1e2a49;font-weight:700}.side footer{margin:auto 10px 0;border-top:1px solid #49617b;padding-top:19px;color:#9fb1c8;font-size:11px;line-height:1.7}.main{min-width:0}.intro{background:radial-gradient(circle at 86% 25%,#35537c 0,#223453 27%,#15213d 72%);border-radius:20px;padding:27px 32px;color:white;min-height:142px;display:flex;justify-content:space-between;gap:25px;align-items:center}.intro small{color:#ff6b60;letter-spacing:2px;font-size:10px;font-weight:800}.intro h1{font-size:28px;margin:9px 0 6px}.intro p{font-size:12px;color:#b8c7dc;margin:0;line-height:1.7}.badge{padding:9px 12px;border:1px solid #7186a3;border-radius:30px;font-size:11px;white-space:nowrap}.alert{padding:12px 16px;margin:14px 0;border-radius:11px;background:#fff2eb;color:#a6412b;font-size:12px;line-height:1.6}.alert:empty{display:none}.body{margin-top:18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:#fff;border:1px solid #e1e7ee;border-radius:15px}.card{padding:20px;min-height:118px}.card small{font-size:11px;color:#7b8ba3}.card strong{display:block;font-size:27px;margin:14px 0 4px}.card span{font-size:10px;color:#8fa0b5}.panel{margin-top:16px;padding:22px}.panel h2{font-size:17px;margin:0 0 8px}.panel>p{font-size:12px;line-height:1.7;color:#697c97;margin:0 0 18px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.panel-head a{color:#d9372b;font-size:12px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:7px;font-size:11px;color:#596b86;min-width:0}.field.wide{grid-column:1/-1}.field input,.field select{height:43px;padding:9px 12px;border:1px solid #d9e1eb;border-radius:9px;background:#fff;color:#1d2743;min-width:0;width:100%;font-size:13px}.field input:focus,.field select:focus{outline:2px solid #b7cce8}.help{color:#8a9bb0;font-size:10px;line-height:1.6}.button{border:0;background:#e33c2d;color:#fff;border-radius:9px;padding:11px 16px;font-size:12px;font-weight:700}.button:disabled{opacity:.5;cursor:not-allowed}.button.secondary{background:#e7edf5;color:#29466e}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #e9edf1;font-size:11px;vertical-align:top}th{font-size:10px;color:#8190a4;background:#f8fafc}td{color:#3c506e}td strong{display:block;color:#1f2f4f;margin-bottom:4px}td small{color:#9aa8b8}.good{color:#26886c}.bad{color:#c84435}.muted{color:#8493a7}.pill{display:inline-block;padding:4px 7px;background:#eef5f1;border-radius:5px;color:#27896d;font-size:10px}.pill.bad{background:#fff0ed;color:#c84435}.cases{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:12px 0 16px}.cases label{background:#f6f8fb;border:1px solid #e5eaf1;border-radius:9px;padding:12px;font-size:12px}.cases input{accent-color:#e33c2d}.output{max-width:320px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;color:#526783}.run-list{display:grid;gap:8px}.run{border:1px solid #e8edf2;border-radius:10px;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;gap:15px;font-size:12px;flex-wrap:wrap}.run small{display:block;color:#91a0b1;margin-top:5px}.link{border:0;background:transparent;color:#c93b2e;padding:0;font-size:12px}.empty{padding:28px;text-align:center;color:#94a1b1;font-size:12px;background:#f8fafc;border-radius:10px}.note{font-size:11px;color:#7689a1;line-height:1.7}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#f4f7fb;border-radius:10px;padding:16px}.metric small{color:#8193a9;font-size:10px}.metric b{display:block;font-size:20px;margin-top:8px}.section-title{font-size:14px;margin:20px 0 11px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:12px}.comparison>div{background:#f7f9fc;border-radius:10px;padding:13px;min-width:0}.comparison h3{font-size:12px;margin:0 0 8px}.comparison pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;font-size:11px;color:#3e526f}.status{position:fixed;right:20px;bottom:18px;padding:11px 16px;border-radius:9px;background:#223553;color:white;font-size:12px;box-shadow:0 12px 35px #17233e2b;display:none;max-width:340px;line-height:1.5}@media(max-width:1050px){.layout{grid-template-columns:190px 1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.top{padding:0 16px;height:65px}.brand img{width:130px}.brand span{display:none}.layout{display:block;padding:12px}.side{min-height:0;padding:13px;margin-bottom:12px}.side h2,.side p,.side footer{display:none}.nav{display:flex;flex-direction:row;overflow:auto}.nav button{white-space:nowrap;padding:9px}.intro{padding:20px}.intro h1{font-size:22px}.badge{display:none}.twocol,.formgrid,.comparison,.three{grid-template-columns:1fr}.field.wide{grid-column:auto}.panel{padding:16px}.cases{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="brand"><img src="/semifly-official-horizontal.svg" alt="semifly.ai"><span>供应商 API 验收台</span></div><a href="/#ops/verification">返回产品验证 ↗</a></header>
<div class="layout"><aside class="side"><div><h2>供应商验收</h2><p>从真实调用出发，逐笔看清质量、用量与成本。</p><nav class="nav" id="nav"></nav></div><footer>内部工具 · 仅供应运营与平台管理员<br>测试请求会消耗上游额度</footer></aside><main class="main"><div class="intro"><div><small>SUPPLIER API LAB</small><h1 id="pageTitle">验收总览</h1><p id="pageSub">每一次测试都留下可追溯的交易记录。</p></div><span class="badge" id="configBadge">正在检查配置</span></div><div class="alert" id="alert"></div><div class="body" id="content"></div></main></div><div class="status" id="toast" role="status"></div>
<script>
(() => {
const tabs=[['overview','总览'],['endpoints','输入 API 与型号'],['cases','任务验收'],['compare','双路对比'],['transactions','逐笔交易'],['billing','计费核对'],['monitor','持续监测']];
const subtitles={overview:'看清测试规模、最近结果与待处理问题。',endpoints:'登记上游与官方对照端点；Key 只提交给服务端加密保存。',cases:'固定任务检查响应格式、Token 用量与基础完成度。',compare:'同一任务调用两路 API，比较结果、Token、延迟与估算成本。',transactions:'每一次探测均有独立记录和上游请求标识。',billing:'根据录入采购费率估算成本，并核对供应商给出的区间金额。',monitor:'观察近期成功率、任务得分与异常；客户交易仍待真实网关接入。'};
const $=s=>document.querySelector(s), esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=v=>v===null||v===undefined?'未设费率':'¥'+Number(v).toFixed(Math.abs(Number(v))>0&&Math.abs(Number(v))<0.000001?12:6), number=v=>Number(v||0).toLocaleString('zh-CN');
let tab='overview',data={config:null,endpoints:[],runs:[],transactions:[],reconciliations:[],discoveries:[],summary:{}},selectedRun=null,toastTimer;
function toast(message){const el=$('#toast');el.textContent=message;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',4200)}
async function api(path,options={}){const response=await fetch('/api/staff/lab/'+path,{credentials:'same-origin',headers:options.body?{'Content-Type':'application/json'}:{},...options});const json=await response.json().catch(()=>({}));if(!response.ok)throw Error(json.error||`HTTP ${response.status}`);return json}
async function load(){try{const [config,endpoints,runs,transactions,reconciliations,summary,discoveries]=await Promise.all(['config','endpoints','runs','transactions','reconciliations','summary','discoveries'].map(x=>api(x)));data={config,endpoints,runs,transactions,reconciliations,summary,discoveries};$('#alert').textContent=config.ready?'':'尚未配置 SUPPLIER_LAB_SECRET。当前可查看页面，保存凭据和运行测试将在配置后开放。';$('#configBadge').textContent=config.ready?'验收服务已就绪':'等待服务端配置';draw()}catch(error){$('#alert').textContent='无法读取验收数据：'+error.message;$('#configBadge').textContent='连接失败'}}
function nav(){ $('#nav').innerHTML=tabs.map(([id,label],i)=>`<button type="button" data-tab="${id}" class="${tab===id?'active':''}">${String(i+1).padStart(2,'0')} · ${label}</button>`).join('') }
function endpointOptions(kind){return data.endpoints.filter(x=>x.kind===kind&&!x.disabled_at).map(x=>`<option value="${esc(x.id)}">${esc(x.label)} · ${esc(x.model_id)}</option>`).join('')}
function stat(label,value,sub){return `<div class="card"><small>${label}</small><strong>${value}</strong><span>${sub}</span></div>`}
function runRows(){return data.runs.length?data.runs.slice(0,8).map(x=>`<div class="run"><div><b>${esc(x.supplier_label)}</b>${x.reference_label?' ↔ '+esc(x.reference_label):''}<small>${new Date(x.created_at).toLocaleString('zh-CN')} · ${x.case_ids.length} 个任务 · ${x.transaction_count} 笔上游调用</small></div><div class="row"><span class="${x.status==='failed'?'bad':x.status==='completed'?'good':'muted'}">${x.status==='completed'?'已完成':x.status==='failed'?'中断':'运行中'}</span><button class="link" data-run="${esc(x.id)}">查看详情 →</button></div></div>`).join(''):'<div class="empty">暂无验收任务。请先登记端点并运行固定任务。</div>'}
function overview(){const s=data.summary,hasSupplier=data.endpoints.some(x=>x.kind==='supplier'&&!x.disabled_at);return `<section class="panel" style="margin-top:0"><div class="panel-head"><div><h2>拿到供应商 API 后，从这里开始</h2><p class="note">这是会真实发出测试请求的内部工具。采购 Key 只在登记时输入一次，页面不会再显示明文。</p></div><button class="button" data-tab="${hasSupplier?'cases':'endpoints'}">${hasSupplier?'运行真实测试':'登记供应商 API'} →</button></div><div class="grid" style="margin-top:18px">${stat('01 · 输入','地址 + Key + 型号','填供应商 HTTPS Base URL、测试 Key 和模型 ID')}${stat('02 · 探测','/models','记录自报型号、响应状态和耗时')}${stat('03 · 验收','固定任务','真正请求 /chat/completions 并逐笔落库')}${stat('04 · 对照','官方 API','同题比较结果、Token、延迟和成本')}</div></section><div class="grid" style="margin-top:16px">${stat('近 7 天探测',number(s.attempts),'仅内部合成测试')}${stat('HTTP 成功',number(s.successful_http),'响应状态为 200')}${stat('任务均分',s.average_task_score===null?'—':esc(s.average_task_score)+'/100','四项确定性初筛')}${stat('预估探测成本',money(s.estimated_probe_cost_yuan),'按录入采购费率计算')}</div><section class="panel"><div class="panel-head"><h2>最近验收</h2><button class="link" data-tab="cases">选择任务 →</button></div><p>单路最多 4 次、双路最多 8 次真实上游调用；不自动重试。每笔请求保存用量、响应和错误。</p><div class="run-list">${runRows()}</div></section><section class="panel"><h2>计算规则与边界</h2><p>每笔先检查 HTTP 200、非空回答，以及输入 Token + 输出 Token = 总 Token；固定题目答对计 100，答错计 0。采购成本 =（输入−缓存命中）×非缓存输入价/M + 缓存命中×缓存输入价/M + 输出×输出价/M。型号名称由上游自报，结果相近不能证明底层型号相同。</p><button class="link" data-tab="billing">查看费用核对 →</button></section>`}
function reuseForm(){return `<section class="panel"><h2>同一 Key 下新增型号</h2><p>选择已登记的端点，复用其加密凭据与 API 地址；每个型号单独保存采购费率。</p><form id="reuseForm" class="formgrid"><label class="field"><span>已有端点</span><select name="source_endpoint_id" required><option value="">请选择</option>${data.endpoints.filter(x=>!x.disabled_at).map(x=>`<option value="${esc(x.id)}">${esc(x.label)} / ${esc(x.model_id)}</option>`).join('')}</select></label><label class="field"><span>新型号 ID</span><input name="model_id" maxlength="120" required placeholder="/models ID"></label><label class="field wide"><span>新端点名称</span><input name="label" maxlength="100" required></label><label class="field"><span>输入 ¥/M Token</span><input name="input_yuan_per_m" inputmode="decimal"></label><label class="field"><span>缓存输入 ¥/M Token</span><input name="cached_input_yuan_per_m" inputmode="decimal"></label><label class="field"><span>输出 ¥/M Token</span><input name="output_yuan_per_m" inputmode="decimal"></label><div class="field wide"><button class="button" ${data.config.ready?'':'disabled'}>保存待测型号</button></div></form></section>`}
function endpoints(){return `<div class="twocol"><section class="panel" style="margin-top:0"><h2>新增测试端点</h2><p>供应商与官方对照端点分别登记。只接受运维白名单内的 HTTPS 主机：${data.config.allowed_hosts.map(esc).join('、')}。</p><form id="endpointForm" class="formgrid" autocomplete="off"><label class="field"><span>用途</span><select name="kind"><option value="supplier">供应商</option><option value="reference">官方对照</option></select></label><label class="field"><span>名称</span><input name="label" maxlength="100" placeholder="智子芯元 · DeepSeek 型号" required></label><label class="field wide"><span>API Base URL</span><input name="base_url" type="url" placeholder="https://api.deepseek.com" required></label><label class="field"><span>上游模型 ID</span><input name="model_id" placeholder="以实际 /models 为准" required></label><label class="field"><span>上游 API Key</span><input name="api_key" type="password" autocomplete="new-password" placeholder="仅在此提交一次" required></label><label class="field"><span>非缓存输入 ¥/M Token</span><input name="input_yuan_per_m" inputmode="decimal" placeholder="合同价格，未知可留空"></label><label class="field"><span>缓存输入 ¥/M Token</span><input name="cached_input_yuan_per_m" inputmode="decimal" placeholder="无单独价格可留空"></label><label class="field"><span>输出 ¥/M Token</span><input name="output_yuan_per_m" inputmode="decimal" placeholder="合同价格，未知可留空"></label><div class="field wide"><span class="help">金额是待核实的采购价，不是客户售价。Key 加密保存；页面与查询接口不会返回 Key。</span><button class="button" ${data.config.ready?'':'disabled'}>保存端点</button></div></form></section><section class="panel" style="margin-top:0"><h2>已登记端点</h2><p>模型名称是供应商声称的型号；只有对照测试和合同资料才能支持对外说明。</p>${data.endpoints.length?`<div class="table-wrap"><table><thead><tr><th>端点</th><th>模型与费率</th><th>状态</th></tr></thead><tbody>${data.endpoints.map(x=>`<tr><td><strong>${esc(x.label)}</strong><small>${x.kind==='reference'?'官方对照':'供应商'} · ${esc(x.base_url)}</small></td><td>${esc(x.model_id)}<small>输入 ${money(x.input_yuan_per_m)} / 输出 ${money(x.output_yuan_per_m)} · M Token</small></td><td>${x.disabled_at?'<span class="bad">已停用</span>':`<button class="link" data-discover="${esc(x.id)}">探测型号</button> <button class="link" data-disable="${esc(x.id)}">停用</button>`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">尚未登记端点</div>'}<h3 class="section-title">最近型号探测</h3>${data.discoveries.length?data.discoveries.slice(0,6).map(x=>`<div class="run"><div><b>${esc(x.endpoint_label)}</b><small>${new Date(x.created_at).toLocaleString('zh-CN')} · HTTP ${x.http_status??'—'} · ${x.latency_ms} ms</small><div class="note">${x.model_ids.length?x.model_ids.map(esc).join(' · '):esc(x.error_code||'没有返回型号')}</div></div></div>`).join(''):'<div class="empty">尚无型号探测</div>'}</section></div>`+reuseForm()}
function casePicker(){return `<div class="cases">${data.config.cases.map(x=>`<label><input type="checkbox" name="case_id" value="${esc(x.id)}" checked> <strong>${esc(x.name)}</strong><span class="help" style="display:block;margin-top:8px">题目：${esc(x.prompt)}<br>通过：${esc(x.expected)} · 输出上限 ${x.max_tokens} Token</span></label>`).join('')}</div>`}
function runForm(compare){return `<section class="panel" style="margin-top:0"><h2>${compare?'运行双路对比':'运行供应商验收'}</h2><p>${compare?'两路使用相同提示词、输出上限和温度；结果不同不直接证明型号造假。':'每条固定任务发起一次真实调用，按响应结构、用量和任务结果判定。'}</p><form id="runForm"><div class="formgrid"><label class="field"><span>供应端点</span><select name="supplier_endpoint_id" required><option value="">请选择</option>${endpointOptions('supplier')}</select></label>${compare?`<label class="field"><span>官方对照端点</span><select name="reference_endpoint_id" required><option value="">请选择</option>${endpointOptions('reference')}</select></label>`:''}</div><h3 class="section-title">固定测试任务</h3>${casePicker()}<div class="row"><button class="button" ${data.config.ready?'':'disabled'}>启动测试</button><span class="note">最多 ${compare?'8':'4'} 次付费上游调用；不自动重试</span></div></form></section><section class="panel"><h2>最近任务</h2><div class="run-list">${runRows()}</div></section>`}
function comparison(){const run=data.runs.find(x=>x.id===selectedRun)||data.runs.find(x=>x.reference_label&&x.status==='completed');if(!run)return '<section class="panel"><h2>尚无双路结果</h2><p>先登记供应商和官方对照端点，再运行相同任务。</p></section>';const tx=data.transactions.filter(x=>x.run_id===run.id);return `<section class="panel"><h2>对比详情 · ${esc(run.supplier_label)} ↔ ${esc(run.reference_label||'无对照')}</h2><p>${new Date(run.created_at).toLocaleString('zh-CN')} · ${esc(run.status)}。以下得分为固定任务的确定性初筛，不能单独代表模型总体能力。</p>${run.case_ids.map(caseId=>{const supplier=tx.find(x=>x.case_id===caseId&&x.kind==='supplier'),reference=tx.find(x=>x.case_id===caseId&&x.kind==='reference');const cell=(x,label)=>`<div><h3>${label} · ${x?x.quality_score:'—'}/100</h3><div class="note">输入 ${x?.input_tokens??'—'} / 输出 ${x?.output_tokens??'—'} Token · ${x?.latency_ms??'—'} ms · ${money(x?.estimated_cost_yuan)}</div><div class="note">返回型号 ${esc(x?.checks?.response_model||'未提供')} · ${x?.checks?.usage_present_and_consistent?'计量自洽':'计量异常'}</div><pre>${esc(x?.output_sample||x?.error_code||'尚未返回')}</pre></div>`;const delta=supplier&&reference?`<p class="note">供应商 − 官方：输入 ${supplier.input_tokens===null||reference.input_tokens===null?'—':supplier.input_tokens-reference.input_tokens} Token；输出 ${supplier.output_tokens===null||reference.output_tokens===null?'—':supplier.output_tokens-reference.output_tokens} Token；耗时 ${supplier.latency_ms-reference.latency_ms} ms。两路返回可能有正常随机性。</p>`:'';return `<h3 class="section-title">${esc(data.config.cases.find(c=>c.id===caseId)?.name||caseId)}</h3><div class="comparison">${cell(supplier,'供应商')}${cell(reference,'官方对照')}</div>${delta}`}).join('')}</section>`}
function transactions(){const rows=selectedRun?data.transactions.filter(x=>x.run_id===selectedRun):data.transactions;return `<section class="panel" style="margin-top:0"><div class="panel-head"><h2>逐笔探测交易</h2>${selectedRun?'<button class="link" id="clearRun">清除筛选</button>':''}</div><p>这是内部验收请求流水。真实客户调用尚未接入；以后客户请求与上游尝试须用同一关联 ID 贯通。</p>${rows.length?`<div class="table-wrap"><table><thead><tr><th>时间 / 来源</th><th>任务与结果</th><th>Token 输入 / 缓存 / 输出</th><th>延迟</th><th>预估采购成本</th><th>上游请求 ID</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('zh-CN')}<small>${esc(x.endpoint_label)} · ${esc(x.model_id)}</small></td><td><strong class="${x.error_code?'bad':'good'}">${esc(x.case_id)} · ${x.quality_score}/100</strong><small>${esc(x.error_code||'完成')}</small></td><td>${x.input_tokens??'—'} / ${x.cached_input_tokens??'—'} / ${x.output_tokens??'—'}</td><td>${x.latency_ms??'—'} ms</td><td>${money(x.estimated_cost_yuan)}</td><td>${esc(x.upstream_request_id||'未提供')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">暂无探测交易</div>'}</section>`}
function billing(){return `<div class="twocol"><section class="panel" style="margin-top:0"><h2>费率与成本</h2><p>每次响应的 Token 按当时端点录入的 ¥/M Token 费率估算。缓存输入若有单独费率，按缓存命中数拆分。</p><div class="three">${[['近 7 天输入',number(data.summary.input_tokens)+' Token'],['近 7 天输出',number(data.summary.output_tokens)+' Token'],['近 7 天探测估算',money(data.summary.estimated_probe_cost_yuan)]].map(x=>`<div class="metric"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><p class="note" style="margin-top:17px">这里先核对验收探测成本。供应商正式账单可能还包含别处调用；未接入客户网关前，不能宣称已完成全量对账。</p></section><section class="panel" style="margin-top:0"><h2>区间金额抽样核对</h2><p>输入供应商对同一端点、同一时段给出的金额，记录差额。请只用于能够隔离探测交易的采购账户。</p><form id="reconcileForm" class="formgrid"><label class="field wide"><span>端点</span><select name="endpoint_id" required><option value="">请选择</option>${endpointOptions('supplier')}</select></label><label class="field"><span>开始时间</span><input type="datetime-local" name="period_start" required></label><label class="field"><span>结束时间</span><input type="datetime-local" name="period_end" required></label><label class="field wide"><span>供应商提供金额 ¥</span><input name="supplier_billed_yuan" inputmode="decimal" placeholder="例如 0.023400" required></label><label class="field wide"><span>说明</span><input name="note" maxlength="500" placeholder="账单编号或后台截图位置"></label><button class="button" ${data.config.ready?'':'disabled'}>记录差异</button></form></section></div><section class="panel"><h2>核对记录</h2>${data.reconciliations.length?`<div class="table-wrap"><table><thead><tr><th>端点 / 时间</th><th>供应商金额</th><th>平台探测估算</th><th>差额</th><th>说明</th></tr></thead><tbody>${data.reconciliations.map(x=>`<tr><td>${esc(x.endpoint_label)}<small>${new Date(x.period_start).toLocaleString('zh-CN')} — ${new Date(x.period_end).toLocaleString('zh-CN')}</small></td><td>${money(x.supplier_billed_yuan)}</td><td>${money(x.observed_cost_yuan)}</td><td class="${Math.abs(Number(x.difference_yuan))>0.01?'bad':'good'}">${money(x.difference_yuan)}</td><td>${esc(x.note)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">暂无费用抽样核对记录</div>'}</section>`}
function monitor(){const s=data.summary;return `<div class="grid">${stat('请求数',number(s.attempts),'近 7 天')}${stat('HTTP 成功率',s.attempts?((Number(s.successful_http)/Number(s.attempts))*100).toFixed(1)+'%':'—','不足样本不计算 SLA')}${stat('记录异常',number(s.issues),'含用量缺失与协议错误')}${stat('p95 耗时',s.p95_latency_ms===null?'—':number(s.p95_latency_ms)+' ms','近 7 天探测；流式首 Token 尚待接入')}</div><section class="panel"><h2>最近任务状态</h2><div class="run-list">${runRows()}</div></section><section class="panel"><h2>下一层监测接入</h2><p>现阶段监测对象是内部合成测试。上线真实调用后，网关必须给每个客户请求生成关联 ID，并把每一次上游尝试、重试、Token 用量和客户扣费分开入账，才能准确比较“客户看到的用量”与“供应商计费的用量”。</p></section>`}
function draw(){nav();$('#pageTitle').textContent=tabs.find(x=>x[0]===tab)[1];$('#pageSub').textContent=subtitles[tab];$('#content').innerHTML=({overview,endpoints,cases:()=>runForm(false),compare:()=>runForm(true)+comparison(),transactions,billing,monitor})[tab]();}
async function refreshRun(runId){for(let i=0;i<80;i++){await new Promise(r=>setTimeout(r,1500));const runs=await api('runs');data.runs=runs;const run=runs.find(x=>x.id===runId);if(run?.status!=='running'){await load();selectedRun=runId;tab=run?.reference_label?'compare':'transactions';draw();toast(run?.status==='completed'?'测试完成，结果已入库':'任务中断，已保留完成的逐笔记录');return}}toast('任务仍在运行，可稍后从最近任务查看');await load()}
document.addEventListener('click',async event=>{const tabButton=event.target.closest('[data-tab]');if(tabButton){tab=tabButton.dataset.tab;selectedRun=null;draw();return}const runButton=event.target.closest('[data-run]');if(runButton){selectedRun=runButton.dataset.run;tab=data.runs.find(x=>x.id===selectedRun)?.reference_label?'compare':'transactions';draw();return}if(event.target.id==='clearRun'){selectedRun=null;draw();return}const discover=event.target.closest('[data-discover]');if(discover){discover.disabled=true;try{const result=await api('endpoints/'+discover.dataset.discover+'/discover',{method:'POST',body:'{}'});await load();tab='endpoints';draw();toast(result.error_code?'型号探测已记录：'+result.error_code:'发现 '+result.model_ids.length+' 个型号')}catch(e){toast(e.message)}finally{discover.disabled=false}return}const disable=event.target.closest('[data-disable]');if(disable){if(!confirm('停用后不能再用该端点发起新测试。确认停用？'))return;try{await api('endpoints/'+disable.dataset.disable+'/disable',{method:'POST',body:'{}'});await load();toast('端点已停用')}catch(e){toast(e.message)}}});
document.addEventListener('submit',async event=>{if(!['endpointForm','reuseForm','runForm','reconcileForm'].includes(event.target.id))return;event.preventDefault();const form=event.target,button=form.querySelector('button[type=submit],button:not([type])');if(button)button.disabled=true;try{const d=new FormData(form);if(form.id==='endpointForm'){const body=Object.fromEntries(d);await api('endpoints',{method:'POST',body:JSON.stringify(body)});form.querySelector('[name=api_key]').value='';await load();toast('端点已保存，Key 不会再次显示')}else if(form.id==='reuseForm'){const body=Object.fromEntries(d);await api('endpoints/'+d.get('source_endpoint_id')+'/models',{method:'POST',body:JSON.stringify(body)});await load();tab='endpoints';draw();toast('新型号已保存')}else if(form.id==='runForm'){const body={supplier_endpoint_id:d.get('supplier_endpoint_id'),reference_endpoint_id:d.get('reference_endpoint_id')||null,case_ids:d.getAll('case_id')};const result=await api('runs',{method:'POST',body:JSON.stringify(body)});toast(`任务已启动，最多 ${result.max_upstream_calls} 次上游调用`);void refreshRun(result.run_id).catch(e=>toast(e.message))}else{const body={endpoint_id:d.get('endpoint_id'),period_start:new Date(d.get('period_start')).toISOString(),period_end:new Date(d.get('period_end')).toISOString(),supplier_billed_yuan:d.get('supplier_billed_yuan'),note:d.get('note')};await api('reconciliations',{method:'POST',body:JSON.stringify(body)});await load();toast('核对差异已记录')}}catch(e){toast(e.message)}finally{if(button)button.disabled=false}});
nav();
$('#content').innerHTML='<section class="panel"><h2>正在读取验收数据</h2><p>请稍候。</p></section>';
void load();
})();
</script>
</body></html>
